<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ILM Practice Book</title><link rel="stylesheet" href="style.css">
<style>
.practice-wrap{padding:35px 0 70px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,32px);box-shadow:0 12px 35px #0923440b}.topline,.actions,.stats{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.stats{justify-content:flex-start}.pill{border:1px solid var(--line);border-radius:30px;padding:9px 13px;font-size:13px;color:var(--navy)}.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}.unit{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;cursor:pointer}.unit:hover{border-color:#c4a04e;background:#fffcf5}.unit b,.unit small{display:block}.unit small{color:var(--muted);margin-top:6px}.unit em{display:inline-block;margin-top:9px;color:#987326;font-style:normal;font-size:11px}.qtitle{font-size:clamp(20px,3vw,27px);line-height:1.5;color:var(--navy);margin:18px 0}.bar{height:8px;background:#edf1f5;border-radius:20px;overflow:hidden;margin:14px 0 22px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#174b83,#c5a04b)}.options{display:grid;grid-template-columns:1fr 1fr;gap:11px}.opt{padding:14px;border:1px solid var(--line);border-radius:12px;background:white;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}.opt.sel{border:2px solid #1c5b91;background:#f2f7fc}.opt.good{border:2px solid #18845d;background:#effaf5}.opt.bad{border:2px solid #c84a4a;background:#fff3f3}.feedback{display:none;padding:16px;margin-top:18px;border-radius:12px;line-height:1.6}.feedback.show{display:block}.feedback.ok{background:#effaf5;color:#145c42}.feedback.no{background:#fff8e9;color:#6e531a}.actions{margin-top:20px}.actions button{cursor:pointer}.hidden{display:none!important}.level{color:#9b762d;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}@media(max-width:600px){.units,.options{grid-template-columns:1fr}}
</style></head><body><header id="site-header"></header><main><section class="page-hero"><div class="container"><span class="eyebrow">ILM Student Learning Portal</span><h1 id="bookTitle">Practice Book</h1><p id="bookSub">Learn step by step, from foundations to challenge questions.</p></div></section><section class="practice-wrap"><div class="container">
<div class="topline"><div class="stats"><span class="pill" id="gradePill">Grade</span><span class="pill">200 Questions</span><span class="pill" id="scorePill">Score: 0</span></div><button class="btn btn-light" id="lang">اردو</button></div>
<div class="panel" id="overview"><h2>Choose a Unit</h2><p class="muted">Each unit has 20 questions: 4 Easy, 4 Medium, 4 Hard, 4 Advanced and 4 Challenge questions.</p><div class="units" id="unitList"></div></div>
<div class="panel hidden" id="quiz"><div class="topline"><span class="level" id="level">Easy</span><span class="pill" id="counter">Question 1 of 20</span></div><div class="bar"><span id="bar" style="width:0%"></span></div><h2 class="qtitle" id="question"></h2><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="actions"><button class="btn btn-light" id="back">All Units</button><div class="actions"><button class="btn btn-light" id="check">Check Answer</button><button class="btn btn-blue" id="next" disabled>Next →</button></div></div></div>
<div class="panel hidden" id="finish"><h2>Unit completed!</h2><h1 id="result"></h1><p id="resultText"></p><button class="btn btn-blue" id="again">Practise Again</button><button class="btn btn-light" id="finishBack">All Units</button></div>
</div></section></main><footer id="site-footer"></footer><script src="script.js"></script>
<script>
(()=>{
const params=new URLSearchParams(location.search),grade=Math.min(9,Math.max(4,Number(params.get('grade'))||4)),book=Math.min(3,Math.max(1,Number(params.get('book'))||1));
document.title='Grade '+grade+' Practice Book '+book+' | ILM';document.getElementById('bookTitle').textContent='Grade '+grade+' Practice Book '+book;document.getElementById('gradePill').textContent='Grade '+grade;
const topicSets=[
['Number Sense','Addition & Subtraction','Multiplication','Division','Factors & Multiples','Fractions','Decimals','Geometry','Measurement','Word Problems'],
['Place Value','Operations','Long Multiplication','Long Division','Equivalent Fractions','Mixed Numbers','Decimals','Perimeter & Area','Angles','Problem Solving'],
['Integers','BODMAS','Factors & LCM','Fractions','Decimals','Percentages','Ratio','Geometry','Measurement','Challenge Problems']
];
const units=topicSets[book-1],unitQs=[];let currentUnit=0,pos=0,score=0,chosen=-1,locked=false,urdu=false;
const $=id=>document.getElementById(id);
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function makeQ(topic,n,level){
 const scale=grade-3,hard=level>=3,challenge=level===4,base=scale*(book+1);
 let a,b,ans,question,explain;
 const type=n%8;
 if(topic.match(/Geometry|Perimeter|Area|Angles/)){
   a=3+((n*7+base*3)% (8+scale*4));b=2+((n*5+base)% (7+scale*3));
   if(type%3===0){ans=2*(a+b);question='A rectangle is '+a+' cm long and '+b+' cm wide. Find its perimeter.';explain='Perimeter = 2 × (length + width) = 2 × ('+a+' + '+b+') = '+ans+' cm.';ans+=' cm';}
   else if(type%3===1){ans=a*b;question='Find the area of a rectangle with length '+a+' cm and width '+b+' cm.';explain='Area = length × width = '+a+' × '+b+' = '+ans+' cm².';ans+=' cm²';}
   else{ans= a*90;question='A shape has '+a+' right angles. What is their total measure?';explain='Each right angle is 90°. '+a+' × 90° = '+ans+'°.';ans+='°';}
 } else if(topic.match(/Fraction|Mixed/)){
   b=2+(n+base)%9;a=1+(n*3+base)%(b-1);let whole=b*(2+(n%5));ans=whole/b*a;
   question='Find '+a+'/'+b+' of '+whole+'.';explain=whole+' ÷ '+b+' = '+(whole/b)+', then '+(whole/b)+' × '+a+' = '+ans+'.';
 } else if(topic.match(/Percent|Ratio/)){
   a=[10,20,25,40,50,75][(n+base)%6];b=40+((n*13+base*7)%160);ans=a*b/100;
   question='Find '+a+'% of '+b+'.';explain=a+'% = '+a+'/100, so '+b+' × '+a+'/100 = '+ans+'.';
 } else if(topic.match(/Decimal/)){
   a=+(1.25+(n*0.37)+(base/10)).toFixed(2);b=+(0.35+(n%7)*0.16).toFixed(2);ans=+(a+b).toFixed(2);
   question='Calculate '+a.toFixed(2)+' + '+b.toFixed(2)+'.';explain='Align decimal points and add: '+a.toFixed(2)+' + '+b.toFixed(2)+' = '+ans.toFixed(2)+'.';ans=ans.toFixed(2);
 } else if(topic.match(/Factor|Multiple|LCM/)){
   a=8+(n*3+base)%22;b=6+(n*5+base)%18;ans=topic.includes('LCM')?a*b/gcd(a,b):gcd(a,b);
   question=(topic.includes('LCM')?'Find the least common multiple (LCM)':'Find the highest common factor (HCF)')+' of '+a+' and '+b+'.';explain=topic.includes('LCM')?'The LCM is the smallest positive number divisible by both numbers. It is '+ans+'.':'The greatest number that divides both '+a+' and '+b+' exactly is '+ans+'.';
 } else {
   a=(grade*17)+(book*23)+(n*7)+11;b=(grade*5)+(book*9)+(n*3)+4;
   if(type%4===0){ans=a+b;question='Calculate '+a+' + '+b+'.';explain=a+' + '+b+' = '+ans+'.';}
   else if(type%4===1){if(b>a)[a,b]=[b,a];ans=a-b;question='Calculate '+a+' − '+b+'.';explain=a+' − '+b+' = '+ans+'.';}
   else if(type%4===2){a=2+(n% (5+scale));b=3+((n+base)%(7+scale));ans=a*b;question='Calculate '+a+' × '+b+'.';explain=a+' × '+b+' = '+ans+'.';}
   else{b=2+(n%(7+scale));ans=3+((n*2+base)%15);a=b*ans;question='Calculate '+a+' ÷ '+b+'.';explain+'Division check: '+ans+' × '+b+' = '+a+'.';}
 }
 if(challenge){question='Challenge: '+question+' Show the calculation carefully.';}
 const raw=String(ans),num=Number(raw.replace(/[^0-9.-]/g,''));let opts=[raw];let delta=Math.max(1,Math.round(Math.abs(num)*.12));for(const d of [delta,-delta,delta*2,-delta*2]){let v=Number.isFinite(num)?String(num+d):raw+' (estimate)';if(!opts.includes(v))opts.push(v);if(opts.length===4)break;}
 let seed=n*31+grade*13+book*7;for(let i=opts.length-1;i>0;i--){seed=(seed*9301+49297)%233280;let j=seed%(i+1);[opts[i],opts[j]]=[opts[j],opts[i]];}
 return {topic,question,answer:raw,explain,options:opts,level:['Easy','Medium','Hard','Advanced','Challenge'][level]};
}
units.forEach((topic,u)=>{let arr=[];for(let i=0;i<20;i++){let level=Math.min(4,Math.floor(i/4));arr.push(makeQ(topic,i+1,level));}unitQs.push(arr);});
const unitList=$('unitList');units.forEach((name,i)=>{let b=document.createElement('button');b.className='unit';b.innerHTML='<b>'+String(i+1).padStart(2,'0')+'. '+name+'</b><small>20 questions · Easy to Challenge</small><em>Not Started</em>';b.onclick=()=>start(i);unitList.appendChild(b);});
function start(i){currentUnit=i;pos=0;score=0;$('overview').classList.add('hidden');$('finish').classList.add('hidden');$('quiz').classList.remove('hidden');render();}
function render(){let q=unitQs[currentUnit][pos];chosen=-1;locked=false;$('level').textContent=q.level;$('counter').textContent='Question '+(pos+1)+' of 20';$('bar').style.width=((pos+1)*5)+'%';$('question').textContent=urdu?'سوال: '+q.question:q.question;$('options').innerHTML='';q.options.forEach((v,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+v;b.onclick=()=>{if(locked)return;chosen=i;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};$('options').appendChild(b);});$('feedback').className='feedback';$('feedback').textContent='';$('check').disabled=false;$('next').disabled=true;$('next').textContent=pos===19?'Finish Unit':'Next →';$('scorePill').textContent='Score: '+score;}
$('check').onclick=()=>{if(chosen<0){$('feedback').className='feedback show no';$('feedback').textContent='Please select an answer first.';return;}locked=true;let q=unitQs[currentUnit][pos],correct=q.options[chosen]===q.answer;if(correct)score++;document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(q.options[i]===q.answer)b.classList.add('good');else if(i===chosen)b.classList.add('bad');});$('feedback').className='feedback show '+(correct?'ok':'no');$('feedback').innerHTML=(correct?'Correct! ':'Keep practising. ')+'<br><b>Answer: '+q.answer+'</b><br><b>Explanation:</b> '+q.explain;$('next').disabled=false;$('check').disabled=true;$('scorePill').textContent='Score: '+score;};
function unitsBack(){$('quiz').classList.add('hidden');$('finish').classList.add('hidden');$('overview').classList.remove('hidden');}
$('back').onclick=unitsBack;$('finishBack').onclick=unitsBack;$('next').onclick=()=>{if(!locked)return;if(pos<19){pos++;render();}else{$('quiz').classList.add('hidden');$('finish').classList.remove('hidden');$('result').textContent=score+' / 20';$('resultText').textContent='You answered '+score+' questions correctly in '+units[currentUnit]+'. Review the explanations and try again to improve.';}};$('again').onclick=()=>start(currentUnit);
$('lang').onclick=()=>{urdu=!urdu;$('lang').textContent=urdu?'English':'اردو';if(!$('quiz').classList.contains('hidden'))render();};
})();
</script></body></html>
