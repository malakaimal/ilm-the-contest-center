<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password | ILM The Contest Center</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-reset-password">
  <header id="site-header"></header>
  <main class="section section-soft">
    <div class="container">
      <div class="form-card" style="max-width:490px">
        <div class="section-heading">
          <span class="tag">Student account security</span>
          <h2>Set a new password</h2>
          <p>Enter your new password below. Use at least 8 characters.</p>
        </div>
        <form id="resetPasswordForm">
          <div class="field">
            <label for="newPassword">New Password</label>
            <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <div class="field">
            <label for="confirmNewPassword">Confirm New Password</label>
            <input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <div class="form-actions">
            <button class="btn btn-blue" id="savePasswordButton" type="submit">Update Password</button>
            <a class="muted" href="login.html">Back to Login</a>
          </div>
        </form>
        <div id="resetMessage" class="form-message" role="status"></div>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="script.js"></script>
  <script>
    const form = document.getElementById("resetPasswordForm");
    const message = document.getElementById("resetMessage");
    const button = document.getElementById("savePasswordButton");
    function showResetMessage(text, type) {
      message.textContent = text;
      message.className = "form-message " + (type || "");
      message.style.display = "block";
    }
    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      const password = document.getElementById("newPassword").value;
      const confirm = document.getElementById("confirmNewPassword").value;
      if (password.length < 8) {
        showResetMessage("Use a password with at least 8 characters.", "error");
        return;
      }
      if (password !== confirm) {
        showResetMessage("The passwords do not match.", "error");
        return;
      }
      if (!window.supabaseClient) {
        showResetMessage("Account service unavailable. Refresh and try again.", "error");
        return;
      }
      button.disabled = true;
      button.textContent = "Updating...";
      try {
        const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
        if (sessionError) throw sessionError;
        if (!sessionData.session) {
          throw new Error("This reset link is invalid or has expired. Request a new password reset email.");
        }
        const { error } = await supabaseClient.auth.updateUser({ password });
        if (error) throw error;
        showResetMessage("Password updated successfully. You can now sign in with your new password.", "success");
        form.reset();
        await supabaseClient.auth.signOut();
        setTimeout(() => location.assign("login.html"), 1800);
      } catch (error) {
        showResetMessage(error.message || "Unable to update password. Request a new reset link.", "error");
      } finally {
        button.disabled = false;
        button.textContent = "Update Password";
      }
    });
  </script>
</body>
</html>
