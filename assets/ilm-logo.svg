<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">ILM The Contest Center</title>
<desc id="desc">Navy ILM lettering with a gold academic cap, sweeping gold arc and open book, above The Contest Center.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4d98d"/><stop offset=".48" stop-color="#c99a35"/><stop offset="1" stop-color="#f2d47f"/></linearGradient>
  <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123d72"/><stop offset="1" stop-color="#061b38"/></linearGradient>
</defs>
<!-- Academic cap -->
<g transform="translate(115 42)">
  <path d="M0 58 132 0 270 54 136 111Z" fill="url(#navy)"/>
  <path d="M47 78 136 118 225 78 214 133Q136 177 58 133Z" fill="#0a2b55"/>
  <path d="M250 57v92" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="250" cy="151" r="8" fill="#d5aa50"/>
  <path d="M250 158q-19 23-12 55m12-55q-2 29 5 57m-5-57q18 23 14 51" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
</g>
<!-- Wordmark -->
<text x="500" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="248" font-weight="bold" letter-spacing="8" fill="#FFFFFF">ILM</text>
<!-- Gold orbit -->
<path d="M105 348C270 150 655 35 900 92C955 105 963 132 930 160" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round"/>
<path d="M105 348C270 150 655 35 900 92" fill="none" stroke="#f8e6b6" stroke-width="3" opacity=".8"/>
<!-- Open book -->
<g transform="translate(255 322)">
  <path d="M0 44Q105 2 245 55V105Q112 65 0 100Z" fill="#FFFFFF"/>
  <path d="M490 44Q385 2 245 55V105Q378 65 490 100Z" fill="#0b2d59"/>
  <path d="M12 43Q115 12 237 57M478 43Q375 12 253 57" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>
  <path d="M245 55V111" stroke="#d6ad55" stroke-width="5"/>
</g>
<!-- Name -->
<path d="M92 462H270M730 462H908" stroke="#c99a35" stroke-width="4"/>
<text x="500" y="476" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="bold" letter-spacing="5" fill="#F0CD78">THE CONTEST CENTER</text>
</svg>