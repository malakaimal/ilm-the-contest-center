<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Look up published ILM results using your registration number."><title>Student Results | ILM The Contest Center</title><link rel="stylesheet" href="style.css"></head><body><header id="site-header"></header><main><section class="page-hero"><div class="container"><span class="eyebrow">ILM The Contest Center</span><h1>Student Results</h1><p>Look up published ILM results using your registration number.</p></div></section><section class="section section-soft"><div class="container"><div class="form-card"><div class="section-heading"><span class="tag">Result search</span><h2>Find your result</h2><p>Enter the registration number provided by ILM. Only results published by an authorised administrator will appear.</p></div><form id="resultLookup"><div class="field"><label for="resultReg">Registration Number</label><input id="resultReg" required placeholder="Example: ILM-2026-000001"></div><button class="btn btn-blue" type="submit">Search Published Result</button></form><div id="resultMessage" class="form-message" role="status"></div><div id="resultOutput" class="spacer-top"></div></div></div></section><script>document.getElementById("resultLookup").addEventListener("submit",async e=>{e.preventDefault();const m=document.getElementById("resultMessage"),o=document.getElementById("resultOutput");m.className="form-message";m.style.display="block";m.textContent="Searching...";o.innerHTML="";const reg=document.getElementById("resultReg").value.trim();const {data,error}=await supabaseClient.from("results").select("student_name,grade,competition,score,total_marks,rank,result_date").eq("registration_id",reg).eq("is_published",true).order("result_date",{ascending:false});if(error){m.className="form-message error";m.textContent="Result search is not ready. Please contact ILM support.";return;}if(!data.length){m.className="form-message";m.textContent="No published result was found for this registration number.";return;}m.className="form-message success";m.textContent="Published result found.";o.innerHTML=data.map(r=>'<div class="card"><h3>'+String(r.competition).replace(/[<>]/g,"")+'</h3><p><b>Student:</b> '+String(r.student_name).replace(/[<>]/g,"")+'</p><p><b>Class:</b> '+String(r.grade||"—")+'</p><p><b>Score:</b> '+r.score+' / '+r.total_marks+'</p><p><b>Position:</b> '+(r.rank||"—")+'</p><p><b>Date:</b> '+(r.result_date||"—")+'</p></div>').join("");});</script></main><footer id="site-footer"></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script><script src="script.js"></script></body></html>
