<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Authorised administrator sign-in for ILM The Contest Center.">
<title>Admin Login | ILM The Contest Center</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-admin-login">
<header id="site-header"></header>
<main class="section section-soft">
<div class="container">
<div class="form-card" style="max-width:490px;margin:0 auto">
<div class="section-heading">
<span class="tag">Authorised personnel only</span>
<h2>Administrator Sign In</h2>
<p>Use an existing ILM account that has been authorised by an ILM administrator. Student accounts cannot enter the Admin Portal.</p>
</div>
<form id="adminLoginForm">
<div class="field"><label for="adminEmail">Administrator Email</label><input id="adminEmail" type="email" autocomplete="username" required></div>
<div class="field"><label for="adminPassword">Password</label><input id="adminPassword" type="password" autocomplete="current-password" required></div>
<button class="btn btn-blue" id="adminLoginButton" type="submit">Sign in securely</button>
</form>
<div id="adminLoginMessage" class="form-message" role="status"></div>
<p class="muted spacer-top text-center"><a href="login.html">Student Login</a> · <a href="index.html">Back to Home</a></p>
</div>
</div>
</main>
<footer id="site-footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="script.js"></script>
<script src="admin-auth.js"></script>
</body>
</html>
