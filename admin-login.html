<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Secure administrator sign-in for ILM The Contest Center.">
  <title>Admin Login | ILM The Contest Center</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="section section-soft">
    <div class="container">
      <div class="form-card" style="max-width:490px;margin:0 auto">
        <div class="section-heading">
          <span class="tag">Authorised personnel only</span>
          <h2>Administrator Sign In</h2>
          <p>Sign in with your registered ILM administrator account. Access is checked securely by the database.</p>
        </div>
        <form id="adminLoginForm" onsubmit="return handleAdminLogin(event)">
          <div class="field">
            <label for="adminEmail">Administrator Email</label>
            <input id="adminEmail" type="email" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="adminPassword">Password</label>
            <input id="adminPassword" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-blue" type="submit">Sign In to Admin Portal</button>
        </form>
        <div id="adminLoginMessage" class="form-message" role="status"></div>
        <p class="muted spacer-top text-center"><a href="login.html" style="color:var(--blue);font-weight:800">Student Login</a> · <a href="index.html" style="color:var(--blue);font-weight:800">Back to Home</a></p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="script.js"></script>
  <script src="auth.js"></script>
  <script>
    async function handleAdminLogin(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const message = document.getElementById("adminLoginMessage");
      const button = form.querySelector('button[type="submit"]');
      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value;
      if (!window.supabaseClient) {
        message.textContent = "Supabase could not load. Check your internet connection and refresh.";
        message.className = "form-message error";
        message.style.display = "block";
        return false;
      }
      button.disabled = true;
      button.textContent = "Checking account...";
      message.textContent = "";
      try {
        const { error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.assign("admin-dashboard.html");
      } catch (error) {
        message.textContent = error.message || "Sign-in failed. Please check your details.";
        message.className = "form-message error";
        message.style.display = "block";
      } finally {
        button.disabled = false;
        button.textContent = "Sign In to Admin Portal";
      }
      return false;
    }
  </script>
</body>
</html>
